name: Release

# Pushing a version tag (v1.2.3) builds the installer and uploads it, with the files the app's
# updater reads, to a draft GitHub release. Publishing the draft is what ships it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          app_version=$(node -p "require('./app/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$version" != "$app_version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json ($version) and app/package.json ($app_version)."
            exit 1
          fi

      - name: Using pnpm
        uses: pnpm/action-setup@v4

      - name: Using Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc, x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./game

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./app

      - name: Build native modules for Electron
        run: pnpm exec electron-builder install-app-deps

      # The same checks JS CI and Game CI run, so a tag on a commit they never passed can't ship.
      - name: Run unit tests
        run: pnpm test --run

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check for circular dependencies
        run: pnpm run check-circular

      - name: Check translation files
        run: pnpm gen-translations --ci

      - name: Check the game's formatting
        run: cargo fmt --all -- --check
        working-directory: ./game

      - name: Lint the game for both architectures
        shell: bash
        run: |
          cargo clippy --all-targets --workspace --target i686-pc-windows-msvc -- -D warnings
          cargo clippy --all-targets --workspace --target x86_64-pc-windows-msvc -- -D warnings
        working-directory: ./game

      - name: Test the game for both architectures
        shell: bash
        run: |
          cargo test --all-targets --no-fail-fast --target i686-pc-windows-msvc
          cargo test --all-targets --no-fail-fast --target x86_64-pc-windows-msvc
        working-directory: ./game

      - name: Build the app
        run: |
          pnpm run clean
          pnpm run build-app-client
          pnpm run build-game
          pnpm run gen-notices

      # electron-builder uploads its files in parallel, and when no release exists yet each upload
      # can create its own draft, splitting the files between them. Starting with one draft avoids
      # that.
      - name: Create the draft release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and upload a draft release
        run: pnpm exec electron-builder build --win --x64 --publish always -c gg-stats.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
